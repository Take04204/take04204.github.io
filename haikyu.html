<style>
:root{
  --bg:#F3F6FA; --ink:#14213D; --sub:#55627A; --card:#FFFFFF; --line:#D5DDE8;
  --court:#1F4E79; --accent:#F28C28; --ball:#F5C518; --onaccent:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A2B; --ink:#E8EEF6; --sub:#9AA8BE; --card:#16263D; --line:#2A3D5A;
    --court:#2C6AA3; --accent:#F59A3E; --ball:#F5C518; --onaccent:#14213D;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A2B; --ink:#E8EEF6; --sub:#9AA8BE; --card:#16263D; --line:#2A3D5A;
  --court:#2C6AA3; --accent:#F59A3E; --ball:#F5C518; --onaccent:#14213D;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px}
h1,h2,.display{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400;letter-spacing:.02em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--ball);outline-offset:2px}

/* hero: court */
.court{position:relative;background:var(--court);color:#fff;border-radius:18px;padding:34px 22px 28px;overflow:hidden}
.court::before{content:"";position:absolute;inset:14px;border:2px solid rgba(255,255,255,.55);border-radius:6px;pointer-events:none}
.court::after{content:"";position:absolute;left:14px;right:14px;top:50%;border-top:4px dashed rgba(255,255,255,.75);pointer-events:none}
.court h1{position:relative;z-index:1;font-size:clamp(34px,10vw,52px);line-height:1.15;margin:0 0 16px}
.court p{position:relative;z-index:1;margin:0;font-weight:700;color:rgba(255,255,255,.92)}
.stats{position:relative;z-index:1;display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.stats span{background:rgba(255,255,255,.14);padding:4px 12px;border-radius:999px;font-size:14px;font-weight:700}
.ball{position:absolute;right:-26px;top:-26px;width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff7cf 0 12%,var(--ball) 13% 46%,#2a62b8 47% 70%,#fff 71%);opacity:.95}
.start{display:block;width:100%;margin-top:22px;padding:18px;border:0;border-radius:14px;background:var(--accent);color:var(--onaccent);
  font-family:"Dela Gothic One",sans-serif;font-size:22px}
.note{font-size:12px;color:var(--sub);margin-top:18px;text-align:center}

/* quiz */
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.count{display:flex;justify-content:space-between;font-size:14px;color:var(--sub);font-weight:700}
.q{font-size:22px;font-weight:900;margin:22px 0 18px;line-height:1.5}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:15px 16px;font-weight:700;font-size:16px;line-height:1.5}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:scale(.99)}
.back{margin-top:18px;background:none;border:0;color:var(--sub);font-weight:700;padding:8px 0}

/* result */
.res{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.jersey{padding:26px 22px 22px;color:#fff;position:relative}
.jersey .school{font-weight:700;font-size:14px;opacity:.95}
.jersey .name{font-size:clamp(32px,9vw,44px);line-height:1.2;margin:6px 0 10px}
.jersey .type{display:inline-block;background:rgba(255,255,255,.95);color:#14213D;font-weight:900;padding:4px 12px;border-radius:8px}
.match{position:absolute;right:18px;top:18px;text-align:right}
.match b{display:block;font-family:"Dela Gothic One",sans-serif;font-size:30px;line-height:1}
.match small{font-size:11px;font-weight:700}
.body{padding:20px 22px 6px}
.body p{margin:0 0 16px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.pair div{border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.pair small{display:block;color:var(--sub);font-weight:700;font-size:12px}
.pair strong{font-size:16px}
.next h3{font-size:15px;margin:0 0 8px;color:var(--sub)}
.next ol{margin:0 0 18px;padding-left:1.4em}
.next li{font-weight:700}
.next li span{color:var(--sub);font-weight:400;font-size:14px}
.actions{display:grid;gap:10px;padding:0 22px 22px}
.btn{display:block;text-align:center;text-decoration:none;padding:15px;border-radius:12px;font-weight:900;border:0;font-size:16px}
.btn.x{background:#14213D;color:#fff}
:root[data-theme="dark"] .btn.x{background:#E8EEF6;color:#14213D}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.x{background:#E8EEF6;color:#14213D}}
.btn.copy{background:var(--accent);color:var(--onaccent)}
.btn.again{background:none;border:2px solid var(--line);color:var(--ink)}
.toast{text-align:center;font-size:13px;color:var(--sub);min-height:1.4em}
.hidden{display:none}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i{transition:none}}
</style>
</head>

// [name, school, type, desc, vector(10), compat, rival]
var CHARS=[
["日向翔陽","烏野","飛び続ける挑戦者","経験や体格の差を気にせず、とにかく前へ突っ込む行動派。できないことを伸びしろに変えられるので、周りの人まで前向きにしてしまう。",[2,1,-1,1,2,2,2,0,1,2],"影山飛雄","星海光来"],
["影山飛雄","烏野","職人気質の天才","一つのことを極めるまで手を止めない完璧主義。言葉は不器用でも、仕事の精度で信頼を勝ち取るタイプ。",[1,-1,1,2,2,-2,1,-1,0,2],"日向翔陽","宮侑"],
["澤村大地","烏野","チームの大黒柱","派手さより安定感で人を引っ張るまとめ役。誰かが崩れても土台がブレないので、あなたがいるだけでチームが落ち着く。",[1,2,1,0,1,1,0,2,2,1],"菅原孝支","黒尾鉄朗"],
["菅原孝支","烏野","空気を読む司令塔","周りの調子や気持ちの変化にいち早く気づく調整役。自分が前に出るより、人を活かすことで大きな力を発揮する。",[0,2,1,0,1,2,0,1,1,0],"澤村大地","影山飛雄"],
["東峰旭","烏野","繊細なエース","実力は十分なのに、責任を人一倍重く受け止める優しい人。支えてくれる仲間がいると、誰よりも大きな仕事をやってのける。",[0,1,0,1,1,0,-2,-1,-2,0],"西谷夕","桐生八"],
["西谷夕","烏野","天性の守護神","センスと度胸を兼ね備えた、迷いのない直感派。どんなピンチでも明るさを失わず、背中で仲間を安心させる。",[2,1,-1,2,1,2,2,0,2,1],"東峰旭","照島遊児"],
["田中龍之介","烏野","折れない根性の人","才能の差を認めたうえで、それでも何度でも立ち上がる強いメンタルの持ち主。熱さと面倒見の良さで、チームの空気を一気に上げる。",[2,1,-2,-2,2,2,2,0,1,2],"西谷夕","五色工"],

["黒尾鉄朗","音駒","面倒見のいい策士","人をよく見て、場を自分のペースに持ち込むのが得意。挑発的に見えて、実は誰よりもチーム全体のことを考えている。",[0,2,2,0,1,2,1,2,2,1],"孤爪研磨","澤村大地"],
["孤爪研磨","音駒","省エネの頭脳派","無駄な労力を使わず、最短ルートで結果を出す観察の達人。普段は控えめでも、相手の弱点を見抜く力はずば抜けている。",[-2,0,2,1,-2,-2,0,-1,2,-1],"黒尾鉄朗","日向翔陽"],
["及川徹","青葉城西","人を活かすプロ","天才ではないと自覚したうえで、努力と観察で頂点を狙う人。仲間一人ひとりの力を最大限まで引き出せるのが最大の武器。",[1,2,2,-1,2,2,1,2,0,2],"岩泉一","牛島若利"],
["岩泉一","青葉城西","実直な相棒","裏表がなく、言うべきことをはっきり言える頼れる存在。調子に乗った相手を引き締めつつ、誰よりも信頼して背中を預ける。",[1,2,0,0,2,1,1,1,2,1],"及川徹","澤村大地"],
["牛島若利","白鳥沢","ブレない絶対王者","周りの評価に左右されず、自分の信じる道をまっすぐ進む人。シンプルに強さを積み上げるので、存在そのものが周りの目標になる。",[0,-2,-1,2,1,-2,2,1,2,1],"天童覚","及川徹"],

["赤葦京治","梟谷","冷静なフォロー役","周りの状況を常に把握し、先回りして手を打つ名サポーター。目立つ人の力を最大化するのが、あなたの一番の才能。",[-1,2,2,0,1,0,-1,0,1,0],"木兎光太郎","大将優"],

["宮治","稲荷崎","マイペースな実力者","熱くなりすぎず、自分の好きなことや大事なものを見失わない人。ほどよい距離感で、どんな相手ともうまくやれる。",[0,1,1,1,0,1,0,0,2,0],"北信介","宮侑"],
["北信介","稲荷崎","積み重ねの人","毎日の当たり前を丁寧にこなすことで、大舞台でも動じない強さを持つ。派手さはなくても、その姿勢が周りの基準になる。",[-1,2,1,-2,2,0,-1,2,2,-1],"宮侑","澤村大地"],

["星海光来","鴎台","不利を跳ね返す強者","足りないものを言い訳にせず、全部できるようになることで答えを出す人。自信と実力の両方を備えた、まさに主役タイプ。",[2,0,0,0,2,1,2,1,2,2],"木兎光太郎","日向翔陽"],
["照島遊児","条善寺","楽しむことの天才","何でも面白がって全力で遊べる、自由なムードメーカー。型にはまらない発想で、周りを巻き込んで場を明るくする。",[1,1,-2,1,-2,2,2,1,1,0],"西谷夕","田中龍之介"],
["池尻隼人","常波","前を向いて進める人","結果がどうであっても、受け止めて次の一歩を踏み出せる人。まっすぐな誠実さで、仲間からの信頼が厚い。",[1,1,0,-1,2,0,-1,1,-1,1],"山口忠","澤村大地"],

];

["リーダーを任されたら？", [["喜んで引き受ける", {"lead": 2, "bold": 1}], ["正直、向いてないと思う", {"lead": -2}], ["任されたなら責任を持ってやる", {"lead": 1, "stable": 1, "grit": 1}], ["自分は裏から支えたい", {"lead": -1, "team": 2}]]],
["勝負事で一番燃えるのは？", [["強い相手に勝つとき", {"compete": 2, "hot": 1}], ["作戦がハマったとき", {"brain": 2}], ["チーム全員で勝ったとき", {"team": 2}], ["自分の記録を更新したとき", {"grit": 2, "team": -1}]]],
["仲間が落ち込んでいたら？", [["明るく声をかける", {"social": 2, "hot": 1}], ["そっとしておく", {"social": -1, "hot": -1}], ["具体的なアドバイスをする", {"brain": 1, "lead": 1}], ["一緒に練習に付き合う", {"team": 2, "grit": 1}]]],
["目立つことについては？", [["大好き", {"social": 1, "bold": 1, "hot": 1, "compete": 1}], ["結果がついてくるならアリ", {"compete": 1, "sense": 1}], ["できれば目立ちたくない", {"bold": -2, "social": -1}], ["目立つより信頼されたい", {"team": 1, "stable": 1}]]],
["相手に挑発されたら？", [["倍にして言い返す", {"compete": 2, "hot": 1, "bold": 1}], ["気にせず結果で黙らせる", {"stable": 2, "sense": 1}], ["逆にこっちが揺さぶる", {"brain": 1, "compete": 1, "bold": 1}], ["ちょっとビビる", {"stable": -2, "bold": -1}]]],
["プレッシャーがかかると？", [["逆に燃える", {"compete": 1, "stable": 2, "hot": 1}], ["体が固くなる", {"stable": -2}], ["冷静に状況を見る", {"brain": 1, "stable": 1, "hot": -1}], ["いつも通りを心がける", {"stable": 1, "grit": 1}]]],
["あなたにとって部活（仕事）とは？", [["一番楽しいもの", {"hot": 2}], ["勝つためにやるもの", {"compete": 2}], ["仲間との居場所", {"team": 2, "social": 1}], ["やると決めたこと", {"grit": 2, "stable": 1}]]]
];

// expected value per dim (center so that frequent dims don't dominate)
var EXP={};DIMS.forEach(function(d){EXP[d]=0});
QS.forEach(function(q){q[1].forEach(function(o){for(var k in o[1])EXP[k]+=o[1][k]/q[1].length})});

// center character vectors so that every character can appear
var MEAN=DIMS.map(function(_,i){var s=0;CHARS.forEach(function(c){s+=c[4][i]});return s/CHARS.length});
CHARS.forEach(function(c){c[4]=c[4].map(function(v,i){return v-MEAN[i]})});

// balance so every character appears about equally
var BIAS=[0.031,0.056,0.115,0.024,-0.078,-0.006,-0.001,-0.013,-0.030,-0.040,0.082,-0.022,0.060,-0.005,-0.064,-0.022,-0.015,0.005,-0.020,-0.005,-0.018,0.025,-0.030,-0.044,0.050,-0.039,0.036,0.002,0.002,-0.037];

var answers=[];var cur=0;
var $=function(id){return document.getElementById(id)};

function show(id){["top","quiz","result"].forEach(function(s){$(s).classList.toggle("hidden",s!==id)});window.scrollTo(0,0)}

function renderQ(){
  var q=QS[cur];
  $("qnum").textContent="Q"+(cur+1);
  $("qtotal").textContent="/ "+QS.length;
  $("barFill").style.width=(cur/QS.length*100)+"%";
  $("backBtn").style.visibility=cur===0?"hidden":"visible";
  var h='<div class="fade"><div class="q">'+q[0]+'</div><div class="opts">';
  q[1].forEach(function(o,i){h+='<button class="opt" data-i="'+i+'">'+o[0]+'</button>'});
  h+='</div></div>';
  $("qbox").innerHTML=h;
  Array.prototype.forEach.call($("qbox").querySelectorAll(".opt"),function(b){
    b.addEventListener("click",function(){answers[cur]=+b.dataset.i;cur++;cur<QS.length?renderQ():finish()});
  });
}

function cos(a,b){var d=0,na=0,nb=0;for(var i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i]}return(na&&nb)?d/Math.sqrt(na*nb):0}

function finish(){
  var raw={};DIMS.forEach(function(d){raw[d]=0});
  answers.forEach(function(ai,qi){var e=QS[qi][1][ai][1];for(var k in e)raw[k]+=e[k]});
  var u=DIMS.map(function(d){return raw[d]-EXP[d]});
  var ranked=CHARS.map(function(c,i){var s=cos(u,c[4]);return{c:c,s:s,k:s+(BIAS[i]||0)}}).sort(function(a,b){return b.k-a.k});
  renderResult(ranked);
}

function pct(s){return Math.max(1,Math.min(99,Math.round(50+50*s)))}

function renderResult(r){
  var top=r[0].c,col=SCHOOLS[top[1]]||"#1F4E79";
  var url="https://take04204.github.io/haikyu.html";
  var share="私は【"+top[0]+"】タイプでした！\n「"+top[2]+"」\n相性がいいのは"+top[5]+"\n#ハイキュー性格診断";
  var xurl="https://x.com/intent/tweet?text="+encodeURIComponent(share)+(url?"&url="+encodeURIComponent(url):"");
  var h='<div class="res fade">'+
   '<div class="jersey" style="background:'+col+'">'+
     '<div class="match"><b>'+pct(r[0].s)+'%</b><small>一致度</small></div>'+
     '<div class="school">'+top[1]+'</div>'+
     '<h2 class="name">'+top[0]+'</h2>'+
     '<span class="type">'+top[2]+'</span>'+
   '</div>'+
   '<div class="body">'+
     '<p>'+top[3]+'</p>'+
     '<div class="pair"><div><small>相性がいいキャラ</small><strong>'+top[5]+'</strong></div>'+
     '<div><small>ライバルになるキャラ</small><strong>'+top[6]+'</strong></div></div>'+
     '<div class="next"><h3>次に近かったキャラ</h3><ol>'+
       [1,2].map(function(i){return'<li>'+r[i].c[0]+' <span>（'+r[i].c[1]+'・'+r[i].c[2]+'）</span></li>'}).join("")+
     '</ol></div>'+
   '</div>'+
   '<div class="actions">'+
     '<a class="btn x" href="'+xurl+'" target="_blank" rel="noopener">Xでシェアする</a>'+
     '<button class="btn copy" id="copyBtn">結果をコピー</button>'+
     '<div class="toast" id="toast"></div>'+
     '<button class="btn again" id="againBtn">もう一度診断する</button>'+
   '</div></div>'+
   '<p class="note">ファンが作った非公式の診断です。原作・公式とは関係ありません。</p>';
  $("result").innerHTML=h;
  $("barFill").style.width="100%";
  show("result");
  $("copyBtn").addEventListener("click",function(){
    var t=share+(url?"\n"+url:"");
    try{
      navigator.clipboard.writeText(t).then(function(){$("toast").textContent="コピーしました"},function(){fallbackCopy(t)});
    }catch(e){fallbackCopy(t)}
  });
  $("againBtn").addEventListener("click",function(){answers=[];cur=0;show("top")});
}

function fallbackCopy(t){
  try{var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();$("toast").textContent="コピーしました"}
  catch(e){$("toast").textContent="コピーできませんでした。長押しで選択してください"}
}

$("startBtn").addEventListener("click",function(){answers=[];cur=0;show("quiz");renderQ()});
$("backBtn").addEventListener("click",function(){if(cur>0){cur--;answers.length=cur;renderQ()}});
</script>
