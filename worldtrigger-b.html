["隊のエースが調子を落としている", [["自分が代わりに点を取る", {"compete": 2, "bold": 1}], ["不調の原因を一緒に探す", {"team": 1, "brain": 1}], ["いつも通りに接する", {"stable": 2}], ["声をかけて励ます", {"social": 1, "hot": 1}]]],
["新しく隊を組むなら、隊長は誰がいい？", [["自分がやる", {"lead": 2, "bold": 1}], ["一番頭のいい人", {"brain": 1, "team": 1}], ["一番強い人", {"compete": 1, "sense": 1}], ["みんなに慕われている人", {"team": 1, "social": 1}]]],
["格上の隊長と1対1になった", [["正面から勝ちにいく", {"compete": 2, "hot": 1}], ["時間を稼いで味方を待つ", {"team": 2}], ["やられる覚悟で一矢報いる", {"bold": 2, "grit": 1}], ["相手の手をじっくり観察する", {"brain": 2}]]],
["個人ランク戦、1日に何戦する？", [["勝てるまで何十戦でも", {"grit": 2, "compete": 1}], ["決めた数だけやる", {"stable": 1, "grit": 1}], ["その日の気分で決める", {"sense": 1, "grit": -1}], ["戦うより記録の研究が大事", {"brain": 2, "grit": -1}]]],
["作戦会議でのあなたは？", [["一番に案を出す", {"bold": 1, "lead": 1}], ["最後に話をまとめる", {"brain": 1, "lead": 1, "stable": 1}], ["雑談で場をなごませる", {"social": 2}], ["決まったことに全力で従う", {"team": 1, "grit": 1}]]],
["次の対戦相手の記録を見る時間", [["何度も見返して研究する", {"brain": 2, "grit": 1}], ["一回見れば十分", {"sense": 2}], ["正直あまり見ない", {"brain": -1, "bold": 1}], ["仲間と見て感想を言い合う", {"team": 1, "social": 1}]]],
["隊の仲間とケンカした", [["自分から謝る", {"team": 1, "stable": 1}], ["納得いくまで言い合う", {"hot": 2, "bold": 1}], ["少し時間をおく", {"stable": 1, "social": -1}], ["誰かに間に入ってもらう", {"social": 1, "brain": 1}]]],
["新しい戦術を思いついた", [["次の試合ですぐ試す", {"bold": 2, "sense": 1}], ["練習で固めてから使う", {"grit": 2, "brain": 1}], ["隊長に判断を任せる", {"team": 1, "lead": -1}], ["やっぱり慣れた戦い方でいく", {"stable": 2, "bold": -1}]]],
["変わったあだ名をつけられた", [["気に入って自分でも使う", {"social": 2, "hot": 1}], ["正直ちょっと困る", {"social": -1, "stable": -1}], ["特に気にしない", {"stable": 2}], ["相手にもあだ名をつけ返す", {"bold": 1, "social": 1}]]],
["試合のあと、負けた相手チームと会った", [["自分から声をかけにいく", {"social": 2, "team": 1}], ["戦い方について質問する", {"brain": 1, "grit": 1}], ["次も勝つと宣言する", {"compete": 2}], ["そっとしておく", {"social": -1, "stable": 1}]]],
["試験の評価で、チームワークが弱いと書かれた", [["結果で見返す", {"compete": 2, "bold": 1}], ["どこが悪かったか考える", {"brain": 1, "team": 1}], ["班の人に直接聞いてみる", {"social": 1, "team": 1}], ["気にしすぎて落ち込む", {"stable": -2}]]],
["遠征に行けるのは、一部の隊員だけ", [["絶対に選ばれたい", {"compete": 2, "hot": 1}], ["隊のみんなで行きたい", {"team": 2}], ["選ばれなくても腕は磨く", {"grit": 2, "stable": 1}], ["正直どちらでもいい", {"compete": -2, "stable": 1}]]],
["あなたが戦う一番の理由は？", [["勝つのが楽しいから", {"compete": 1, "hot": 1, "sense": 1}], ["叶えたい目的があるから", {"grit": 2, "lead": 1}], ["仲間と一緒にいたいから", {"team": 1, "social": 2}], ["誰かを守りたいから", {"team": 2, "hot": 1}]]]
];

// expected value per dim (center so that frequent dims don't dominate)
var EXP={};DIMS.forEach(function(d){EXP[d]=0});
QS.forEach(function(q){q[1].forEach(function(o){for(var k in o[1])EXP[k]+=o[1][k]/q[1].length})});

// center character vectors so that every character can appear
var MEAN=DIMS.map(function(_,i){var s=0;CHARS.forEach(function(c){s+=c[4][i]});return s/CHARS.length});
CHARS.forEach(function(c){c[4]=c[4].map(function(v,i){return v-MEAN[i]})});

// balance so every character appears about equally
var BIAS=[0.075, 0.069, 0.028, -0.025, -0.055, 0.016, -0.034, -0.124, -0.084, -0.056, 0.032, -0.004, 0.091, -0.053, 0.048, -0.025, -0.038, 0.046, -0.026, -0.039, 0.091, -0.138, 0.01, 0.055, 0.005, 0.023, 0.069, -0.001, 0.024, 0.023];

var answers=[];var cur=0;
var $=function(id){return document.getElementById(id)};

function show(id){["top","quiz","result"].forEach(function(s){$(s).classList.toggle("hidden",s!==id)});window.scrollTo(0,0)}

function renderQ(){
  var q=QS[cur];
  $("qnum").textContent="Q"+(cur+1);
  $("qtotal").textContent="/ "+QS.length;
  $("barFill").style.width=(cur/QS.length*100)+"%";
  $("backBtn").style.visibility=cur===0?"hidden":"visible";
  var h='<div class="fade"><div class="q">'+q[0]+'</div><div class="opts">';
  q[1].forEach(function(o,i){h+='<button class="opt" data-i="'+i+'">'+o[0]+'</button>'});
  h+='</div></div>';
  $("qbox").innerHTML=h;
  Array.prototype.forEach.call($("qbox").querySelectorAll(".opt"),function(b){
    b.addEventListener("click",function(){answers[cur]=+b.dataset.i;cur++;cur<QS.length?renderQ():finish()});
  });
}

function cos(a,b){var d=0,na=0,nb=0;for(var i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i]}return(na&&nb)?d/Math.sqrt(na*nb):0}

function finish(){
  var raw={};DIMS.forEach(function(d){raw[d]=0});
  answers.forEach(function(ai,qi){var e=QS[qi][1][ai][1];for(var k in e)raw[k]+=e[k]});
  var u=DIMS.map(function(d){return raw[d]-EXP[d]});
  var ranked=CHARS.map(function(c,i){var s=cos(u,c[4]);return{c:c,s:s,k:s+(BIAS[i]||0)}}).sort(function(a,b){return b.k-a.k});
  renderResult(ranked);
}

function pct(s){return Math.max(1,Math.min(99,Math.round(50+50*s)))}

function renderResult(r){
  var top=r[0].c,col=SCHOOLS[top[1]]||"#1F4E79";
  var url="https://take04204.github.io/worldtrigger-b.html";
  var share="私は【"+top[0]+"】タイプでした！（B級版）\n「"+top[2]+"」\n相性がいいのは"+top[5]+"\n#ワートリ性格診断";
  var xurl="https://x.com/intent/tweet?text="+encodeURIComponent(share)+(url?"&url="+encodeURIComponent(url):"");
  var h='<div class="res fade">'+
   '<div class="jersey" style="background:'+col+'">'+
     '<div class="match"><b>'+pct(r[0].s)+'%</b><small>一致度</small></div>'+
     '<div class="school">'+top[1]+'</div>'+
     '<h2 class="name">'+top[0]+'</h2>'+
     '<span class="type">'+top[2]+'</span>'+
   '</div>'+
   '<div class="body">'+
     '<p>'+top[3]+'</p>'+
     '<div class="pair"><div><small>相性がいいキャラ</small><strong>'+top[5]+'</strong></div>'+
     '<div><small>ライバルになるキャラ</small><strong>'+top[6]+'</strong></div></div>'+
     '<div class="next"><h3>次に近かったキャラ</h3><ol>'+
       [1,2].map(function(i){return'<li>'+r[i].c[0]+' <span>（'+r[i].c[1]+'・'+r[i].c[2]+'）</span></li>'}).join("")+
     '</ol></div>'+
   '</div>'+
   '<div class="actions">'+
     '<a class="btn x" href="'+xurl+'" target="_blank" rel="noopener">Xでシェアする</a>'+
     '<button class="btn copy" id="copyBtn">結果をコピー</button>'+
     '<div class="toast" id="toast"></div>'+
     '<a class="btn again" href="worldtrigger-a.html">A級版もやってみる</a>'+
     '<button class="btn again" id="againBtn">もう一度診断する</button>'+
   '</div></div>'+
   '<p class="note">ファンが作った非公式の診断です。原作・公式とは関係ありません。</p>';
  $("result").innerHTML=h;
  $("barFill").style.width="100%";
  show("result");
  $("copyBtn").addEventListener("click",function(){
    var t=share+(url?"\n"+url:"");
    try{
      navigator.clipboard.writeText(t).then(function(){$("toast").textContent="コピーしました"},function(){fallbackCopy(t)});
    }catch(e){fallbackCopy(t)}
  });
  $("againBtn").addEventListener("click",function(){answers=[];cur=0;show("top")});
}

function fallbackCopy(t){
  try{var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();$("toast").textContent="コピーしました"}
  catch(e){$("toast").textContent="コピーできませんでした。長押しで選択してください"}
}

$("startBtn").addEventListener("click",function(){answers=[];cur=0;show("quiz");renderQ()});
$("backBtn").addEventListener("click",function(){if(cur>0){cur--;answers.length=cur;renderQ()}});
</script>
