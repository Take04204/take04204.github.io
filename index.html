<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>キャラ性格診断｜あなたは誰タイプ？</title>
<meta name="description" content="好きな作品の「自分に似てるキャラ」がすぐわかる性格診断。ファンによる非公式の診断です。">
<meta property="og:type" content="website">
<meta property="og:title" content="キャラ性格診断｜あなたは誰タイプ？">
<meta property="og:description" content="好きな作品の「自分に似てるキャラ」がすぐわかる性格診断。">
<meta property="og:url" content="https://take04204.github.io/">
<meta property="og:image" content="https://take04204.github.io/ogp-top.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://take04204.github.io/ogp-top.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6FA;--ink:#14213D;--sub:#55627A;--card:#fff;--line:#D5DDE8;--navy:#1F4E79;--orange:#F28C28;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0E1A2B;--ink:#E8EEF6;--sub:#9AA8BE;--card:#16263D;--line:#2A3D5A}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:30px 22px;text-align:center}
.hero h1{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(28px,8vw,40px);line-height:1.25;margin:0 0 14px}
.tag{display:inline-block;background:var(--orange);padding:4px 16px;border-radius:999px;font-weight:900}
.hero p{margin:12px 0 0;font-weight:700;color:#C9D6E6;font-size:14px}
h2{font-size:16px;color:var(--sub);margin:28px 0 12px}
.list{display:grid;gap:12px}
.item{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.item:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.dot{flex:0 0 46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:24px}
.item b{display:block;font-size:18px;font-weight:900}
.item small{color:var(--sub);font-weight:700}
.go{margin-left:auto;color:var(--sub);font-weight:900}
.new{display:inline-block;background:var(--orange);color:#fff;font-size:11px;padding:0 8px;border-radius:6px;margin-left:6px;vertical-align:2px}
.note{font-size:12px;color:var(--sub);text-align:center;margin-top:26px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>あなたは、<br>誰タイプ？</h1>
    <span class="tag">キャラ性格診断、続々公開中</span>
    <p>質問に答えるだけで、あなたに一番近いキャラがわかる</p>
  </header>

  <h2>好きな作品を選んでください</h2>
  <nav class="list" id="list"></nav>

  <p class="note">ファンが作った非公式の診断です。原作・公式とは関係ありません。</p>
</div>
<script>
// 新しい診断はここに1行追加するだけ（上にあるほど新しい）
var QUIZZES=[
  {name:"キングダム",file:"kingdom.html",chars:40,qs:12,emoji:"⚔️",color:"#7A1F1F",isNew:true},
  {name:"BLEACH",file:"bleach.html",chars:40,qs:12,emoji:"🌙",color:"#24272E",isNew:true},
  {name:"ブルーロック",file:"bluelock.html",chars:30,qs:12,emoji:"⚽",color:"#0B3D91",isNew:true},
  {name:"ワールドトリガー",title:"ワールドトリガー性格診断【A級版】",file:"worldtrigger-a.html",chars:34,qs:12,emoji:"🛡️",color:"#15181F",isNew:false},
  {name:"ワールドトリガー",title:"ワールドトリガー性格診断【B級版】",file:"worldtrigger-b.html",chars:30,qs:12,emoji:"🎯",color:"#0E6B4A",isNew:false},
  {name:"ヒロアカ",file:"heroaca.html",chars:30,qs:12,emoji:"💥",color:"#14532D",isNew:false},
  {name:"ワンピース",file:"onepiece.html",chars:40,qs:12,emoji:"🏴‍☠️",color:"#123B6B",isNew:false},
  {name:"ハイキュー",file:"haikyu.html",chars:30,qs:12,emoji:"🏐",color:"#E8761E",isNew:false}
];
var h="";
QUIZZES.forEach(function(q){
  h+='<a class="item" href="'+q.file+'"><span class="dot" style="background:'+q.color+'">'+q.emoji+'</span>'+
     '<span><b>'+(q.title||q.name+'性格診断')+(q.isNew?'<span class="new">NEW</span>':'')+'</b><small>全'+q.chars+'キャラ・'+q.qs+'問</small></span>'+
     '<span class="go">›</span></a>';
});
document.getElementById("list").innerHTML=h;
</script>
</body>
</html>
